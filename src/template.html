<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stokastisk Ekspress</title>
<script>
// apply saved theme before first paint
try{ const s=JSON.parse(localStorage.getItem("stokastiskEkspress.istt1001.v1")||"{}"); if(s.theme==="dark"||s.theme==="light") document.documentElement.setAttribute("data-theme", s.theme); }catch(e){}
</script>
<style>
:root{
  --bg:#0b1424; --bg2:#13223a; --panel:rgba(15,27,47,.84); --panel-solid:#14233b; --border:rgba(150,180,220,.2);
  --text:#eef3fb; --muted:#9fb0c8; --accent:#6ea8ff; --accent2:#ff8a5b; --good:#3ecf8e; --bad:#ff5d6c; --warn:#ffc857;
  --opt:rgba(27,43,70,.86); --opt-hover:#22385c; --shadow:0 10px 40px rgba(0,0,0,.45); --code:#0d192c; --skymode:0;
  --rail:#8a97a8; --sleeper:#6b4f3a;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#dbe9f4; --bg2:#f3f7fb; --panel:rgba(255,255,255,.88); --panel-solid:#fff; --border:rgba(30,60,100,.16);
    --text:#16243a; --muted:#56657d; --accent:#1d4ed8; --accent2:#c2410c; --good:#15803d; --bad:#dc2626; --warn:#b45309;
    --opt:rgba(239,244,250,.94); --opt-hover:#e1ebf7; --shadow:0 10px 30px rgba(20,50,90,.14); --code:#f1f5f9; --skymode:1;
    --rail:#5b6573; --sleeper:#8a6a4f;
  }
}
:root[data-theme="light"]{
  --bg:#dbe9f4; --bg2:#f3f7fb; --panel:rgba(255,255,255,.88); --panel-solid:#fff; --border:rgba(30,60,100,.16);
  --text:#16243a; --muted:#56657d; --accent:#1d4ed8; --accent2:#c2410c; --good:#15803d; --bad:#dc2626; --warn:#b45309;
  --opt:rgba(239,244,250,.94); --opt-hover:#e1ebf7; --shadow:0 10px 30px rgba(20,50,90,.14); --code:#f1f5f9; --skymode:1;
  --rail:#5b6573; --sleeper:#8a6a4f;
}
:root[data-theme="dark"]{
  --bg:#0b1424; --bg2:#13223a; --panel:rgba(15,27,47,.84); --panel-solid:#14233b; --border:rgba(150,180,220,.2);
  --text:#eef3fb; --muted:#9fb0c8; --accent:#6ea8ff; --accent2:#ff8a5b; --good:#3ecf8e; --bad:#ff5d6c; --warn:#ffc857;
  --opt:rgba(27,43,70,.86); --opt-hover:#22385c; --shadow:0 10px 40px rgba(0,0,0,.45); --code:#0d192c; --skymode:0;
  --rail:#8a97a8; --sleeper:#6b4f3a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100vh;color:var(--text);background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;overflow-x:hidden}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}
.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:34px;display:inline-block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));animation:chug .9s ease-in-out infinite}
@keyframes chug{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
.brand h1{margin:0;font-size:24px;letter-spacing:.5px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--muted);font-size:13px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
.pill{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:14px}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.seg.big-seg button{padding:9px 16px;font-size:15px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.screen{display:none}
.screen.active{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.hero p{color:var(--muted);margin:.3em 0}
.big{border:0;border-radius:14px;padding:13px 22px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 22px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .15s}
.big:hover:not(:disabled){transform:translateY(-2px) scale(1.02)}
.big:disabled{opacity:.45}
.ghost{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:11px 16px;font-weight:600}
.ghost:hover:not(:disabled){border-color:var(--accent)}
.ghost:disabled{opacity:.4}
.ghost.on{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,var(--panel))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--opt);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.stat.level{grid-column:1/-1;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 30%,var(--opt)),color-mix(in srgb,var(--accent2) 25%,var(--opt)))}
.lvlbar{height:6px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden;margin-top:6px}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,var(--accent2))}
h2{margin:.2em 0 .6em;font-size:20px}
h3{margin:.8em 0 .4em;font-size:16px}
.modebox{margin-top:14px;padding:12px;border-radius:14px;background:var(--opt);border:1px solid var(--border)}
.modebox .desc{font-size:13px;color:var(--muted);margin:6px 0 0}
.examopts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lenrow{display:flex;gap:12px;align-items:center;margin-top:10px}
.lenrow input[type=range]{flex:1;min-width:0;max-width:340px;accent-color:var(--accent);cursor:pointer}
.lenrow b{min-width:2.2em;text-align:center;font-size:18px;font-variant-numeric:tabular-nums}
.route{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,auto);grid-auto-flow:column;column-gap:22px}
.station{position:relative;display:grid;grid-template-columns:54px 1fr;gap:4px 12px;align-items:center;text-align:left;width:100%;border:0;background:transparent;padding:8px 10px 8px 0;border-radius:14px;transition:background .2s}
.station::before{content:"";position:absolute;left:24px;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,var(--rail) 0 3px,transparent 3px 9px),linear-gradient(90deg,var(--rail) 0 1.5px,transparent 1.5px 4.5px,var(--rail) 4.5px 6px);opacity:.75}
.station.first::before{top:50%}.station.last::before{bottom:50%}
@media (min-width:701px){.station.cfirst::before{top:50%}.station.clast::before{bottom:50%}}
.station .sinfo>span{display:block}
.station .sinfo>.pname{display:flex}
.station:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.station:hover .node{transform:scale(1.08)}
.node{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:4px solid var(--panel-solid);box-shadow:0 0 0 2px var(--rail),0 6px 16px rgba(0,0,0,.25);transition:transform .2s}
.node.done{box-shadow:0 0 0 2px var(--good),0 0 18px color-mix(in srgb,var(--good) 55%,transparent)}
.station .sinfo{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:8px 12px;min-width:0}
.station:hover .sinfo{border-color:var(--accent)}
.station .pname{font-weight:800;font-size:15px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.station .pname small{font-weight:600;font-size:11px;color:var(--muted);white-space:nowrap}
.station .tname{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--opt);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--warn),var(--good));background-size:300% 100%}
.station .acc{font-size:11px;color:var(--muted);margin-top:3px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:18px;height:18px}
.resume{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px dashed var(--warn);display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.track{position:relative;flex:1;min-width:220px;height:46px}
.track .line{position:absolute;left:4px;right:4px;top:30px;height:8px;background:linear-gradient(180deg,var(--rail) 0 2px,transparent 2px 6px,var(--rail) 6px 8px),repeating-linear-gradient(90deg,var(--sleeper) 0 4px,transparent 4px 11px);opacity:.85;border-radius:2px}
.track .dot{position:absolute;top:24px;width:20px;height:20px;border-radius:50%;background:var(--panel-solid);border:3px solid var(--rail);transform:translateX(-50%);padding:0;z-index:1}
.track .dot.good{background:var(--good);border-color:var(--good)}
.track .dot.bad{background:var(--bad);border-color:var(--bad)}
.track .dot.skip{background:var(--muted);border-color:var(--muted)}
.track .dot.viewing{outline:3px solid var(--accent);outline-offset:2px}
.track .dot:disabled{cursor:default}
.track .loco{position:absolute;top:-4px;width:58px;height:34px;transform:translateX(-50%);transition:left .7s cubic-bezier(.45,1.4,.5,1);pointer-events:none;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.track .loco svg{width:100%;height:100%;display:block;animation:chug .5s ease-in-out infinite}
.score{font-size:20px;font-weight:800;min-width:110px;text-align:right}
.score small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--border)}
.timer.low{color:var(--bad);border-color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qcard{position:relative}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--opt);border:1px solid var(--border)}
.badge.exam{background:rgba(255,200,87,.18);border-color:rgba(255,200,87,.5)}
.badge.kind{background:color-mix(in srgb,var(--accent2) 18%,var(--opt));border-color:color-mix(in srgb,var(--accent2) 45%,transparent)}
.badge.topic{color:#fff;border:0}
.badge.review{background:color-mix(in srgb,var(--accent) 25%,var(--opt))}
.qtext{font-size:18px;margin:6px 0 12px}
table.cm{border-collapse:collapse;margin:8px 0;font-size:15px}
table.cm th,table.cm td{border:1px solid var(--border);padding:4px 10px;text-align:center}
table.cm th{background:var(--opt);font-weight:600}
code{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;font-size:.92em;background:var(--code);padding:1px 5px;border-radius:5px}
pre.code{background:var(--code);border:1px solid var(--border);border-radius:12px;padding:12px 14px;overflow-x:auto;font-size:14px;margin:0 0 12px}
pre.code code{background:none;padding:0}
.formula{background:var(--code);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:15px;line-height:1.7;overflow-x:auto}
.formula .fl{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.formula sub,.formula sup{font-size:.72em}
.formula .katex{font-size:1.12em;display:inline-block;margin:.18em 0;max-width:100%;vertical-align:middle}
.formula .katex-display{margin:.2em 0}
.gexp .katex,.gcard details .katex{font-size:1.05em}
.fig{display:flex;justify-content:center;margin:0 0 12px}
.fig svg{max-width:100%;height:auto;background:var(--panel-solid);border-radius:12px;border:1px solid var(--border)}
.opts{display:grid;gap:9px}
.opts.tfopts{grid-template-columns:1fr 1fr}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid transparent;background:var(--opt);border-radius:12px;padding:11px 14px;transition:background .15s,transform .1s,border-color .15s}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--panel-solid);border:1px solid var(--border)}
.opt .k.box{font-size:18px;border-radius:6px}
.opt.tf{justify-content:center;align-items:center;font-size:18px;font-weight:700;padding:16px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--opt))}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--opt))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--opt))}
.opt.missed{border:2px dashed var(--good)}
.opt.dim{opacity:.55}
.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted)}
.feedback{margin-top:14px;border-radius:14px;padding:14px;border:1px solid var(--border);background:var(--opt);display:none}
.feedback.show{display:block;animation:fadein .3s}
.feedback.good{border-color:var(--good)} .feedback.bad{border-color:var(--bad)}
.feedback .quip{font-weight:800;font-size:17px;margin-bottom:6px}
.pts{float:right;font-weight:800;font-size:18px}
.pts.good{color:var(--good)} .pts.bad{color:var(--bad)}
.ex-row{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--panel-solid);border-left:4px solid var(--muted)}
.ex-row.good{border-left-color:var(--good)} .ex-row.bad{border-left-color:var(--bad)} .ex-row.warn{border-left-color:var(--warn)}
.ex-row ul{margin:4px 0 0;padding-left:20px}
.ex-why{margin:6px 0;font-size:15px}
.ex-note{font-size:14px;color:var(--muted);margin-top:3px}
details.allopts{margin-top:8px}
details.allopts summary{cursor:pointer;color:var(--accent);font-size:14px;font-weight:600}
details.allopts ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
details.allopts li{padding:7px 10px;border-radius:10px;background:var(--panel-solid);font-size:14px}
details.allopts li .mk{display:inline-block;width:20px;font-weight:900}
details.allopts li.t .mk{color:var(--good)} details.allopts li.f .mk{color:var(--bad)}
details.allopts .note{color:var(--muted);font-size:13px;margin:2px 0 0 20px}
.you{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;margin-left:4px;white-space:nowrap}
.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.glow{animation:glow .7s}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(61,220,151,0)}40%{box-shadow:0 0 0 8px rgba(61,220,151,.35)}100%{box-shadow:var(--shadow)}}
.fx{position:fixed;pointer-events:none;z-index:50;font-size:34px;animation:fly 1.1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.6) rotate(200deg)}}
.banner{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;font-size:clamp(26px,6vw,52px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#ffd166,#ff8a5b,#6ea8ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop 1.4s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
/* exam navigator */
.nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.navgroup{display:flex;flex-direction:column;gap:4px}
.navgroup .gl{font-size:11px;color:var(--muted)}
.navgroup .chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--opt);font-size:13px;font-weight:700;position:relative;padding:0}
.chip.ans{background:color-mix(in srgb,var(--accent) 45%,var(--opt));border-color:var(--accent)}
.chip.cur{outline:3px solid var(--accent2);outline-offset:1px}
.chip.flag::after{content:"🚩";position:absolute;top:-9px;right:-7px;font-size:12px}
.confirm{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 14%,var(--panel));display:none}
.confirm.show{display:block}
/* result */
.rank{text-align:center;padding:10px 0 4px}
.rank .em{font-size:64px;display:block;animation:bob 3s ease-in-out infinite}
.rank .title{font-size:26px;font-weight:900;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.rank .num{font-size:40px;font-weight:900;margin:4px 0}
.rank .sub{color:var(--muted)}
.grade{display:inline-block;margin-top:6px;font-size:22px;font-weight:900;padding:4px 16px;border-radius:12px;background:var(--opt);border:1px solid var(--border)}
.list{display:grid;gap:8px;margin-top:12px}
.item{border:1px solid var(--border);border-left:5px solid var(--muted);border-radius:12px;padding:10px 12px;background:var(--opt)}
.item.good{border-left-color:var(--good)} .item.bad{border-left-color:var(--bad)}
.item .head{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.item .qq{margin:4px 0;font-size:15px}
.item > details > summary{cursor:pointer;color:var(--accent);font-size:14px}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log th,table.log td{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left}
table.log td.n,table.log th.n{text-align:right;white-space:nowrap}
footer{color:var(--muted);font-size:12px;text-align:center;margin:18px 0 6px}
.guide-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.gsearch{font:inherit;font-size:15px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:var(--opt);color:var(--text);width:min(320px,100%)}
.gsearch:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chips .pill{font-size:13px}
.gtopic{margin-top:18px;scroll-margin-top:12px}
.gtopic-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.gtopic-h .badge{font-size:14px;padding:5px 12px}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;min-width:0}
.gcard h4{margin:0 0 8px;font-size:15px}
.gcard .formula{margin-bottom:8px}
.gcard .gexp{font-size:14px;line-height:1.55;color:var(--text)}
.gcard details{margin-top:8px;font-size:14px}
.gcard details summary{cursor:pointer;color:var(--accent)}
.gcard details>div{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--opt)}
.gcard .gset{color:var(--muted);font-style:italic}
.gcard ol.gsteps{margin:6px 0;padding-left:22px;line-height:1.6}
.gcard ol.gsteps li{margin:2px 0}
.gcard .gans{margin-top:4px}
.modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(4,9,18,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:12px;overflow-y:auto}
.modal.show{display:block;animation:fadein .25s}
.mbox{max-width:920px;margin:12px auto;background:var(--panel-solid);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mhead h2{margin:0}
.mtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:4px 0 10px;font-size:14px}
.tabctl input,.tabctl select{font:inherit;font-size:15px;width:90px;padding:6px 8px;border-radius:10px;border:1px solid var(--border);background:var(--opt);color:var(--text)}
.tabwrap{overflow-x:auto;max-width:100%}
table.stab{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;margin:0 auto 10px}
table.stab th,table.stab td{padding:3px 7px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.stab th{background:var(--opt);position:sticky;top:0}
table.stab td.h,table.stab th.h{text-align:left;font-weight:700;background:var(--opt)}
table.stab tr:hover td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.fsheet{columns:2 360px;column-gap:18px}
.fsec{break-inside:avoid;margin:0 0 14px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--panel)}
.fsec h3{margin:0 0 6px;font-size:14px}
.frow{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;padding:3px 0;border-bottom:1px dashed var(--border);font-size:13px}
.frow:last-child{border-bottom:0}
.frow .fn{color:var(--muted);min-width:120px;flex:0 0 auto}
.frow .ff{flex:1 1 220px;overflow-x:auto}
.frow .katex{font-size:1.02em}
@media (max-width:700px){
  .hero{grid-template-columns:1fr}
  .qtext{font-size:16px}
  .route{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
  .brand h1{font-size:20px}
  .score{min-width:auto}
  .opts.tfopts{grid-template-columns:1fr 1fr}
  .guide-grid{grid-template-columns:1fr}
}

.numin{font:inherit;font-size:20px;font-weight:700;padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--opt);color:var(--text);width:min(240px,100%)}
.numin:focus{outline:none;border-color:var(--accent)}
.numin.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--opt))}
.numin.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--opt))}
.numunit{font-size:18px;font-weight:700;color:var(--muted)}
.ehint{font-size:12px;color:var(--warn);min-height:1em;margin-top:6px}

.rep .ex-row{background:#f6f7fb}
.rep pre.code{background:#f1f3fb;border:1px solid #ccd2e6;white-space:pre-wrap}

function isEmpty(chosen){ return chosen === null || chosen === undefined || (Array.isArray(chosen) && chosen.length === 0); }
function parseNum(s){

}
function resultOf(q, chosen){
  if(isEmpty(chosen)) return "skip";
  if(q.kind === "num") return Math.abs(Number(chosen) - q.ans) <= q.tol + 1e-9 ? "correct" : "wrong";
  if(q.kind === "multi"){ const a = [...q.a].sort((x,y)=>x-y), c = [...chosen].sort((x,y)=>x-y); return (a.length===c.length && a.every((v,i)=>v===c[i])) ? "correct" : "wrong"; }

}
function pointsFor(q, chosen){

  return r === "correct" ? 1 : 0; // as on the ISTx100y exam: no negative points
}
function scoreExam(qs, ans, groups){
  const perQ = qs.map((q,i) => pointsFor(q, ans[i]));

  if(groups){ gs = groups.map(g => { const raw = perQ.slice(g.start, g.start+g.len).reduce((s,x)=>s+x,0); return {t:g.t, raw, floored:raw, len:g.len}; }); total = gs.reduce((s,g)=>s+g.floored,0); }

}
function gradeFor(pct){ for(const [min,g] of GRADES) if(pct >= min - 1e-9) return g; return "F"; }
const fmt = x => { const r = Math.round(x*100)/100; return (Object.is(r,-0)?0:r).toFixed(2).replace(/\.00$/,""); };

const rnd = () => Math.random();

function weightedPick(items, wfn){
  const ws = items.map(wfn), tot = ws.reduce((s,w)=>s+w,0);
  if(tot <= 0) return items[Math.floor(rnd()*items.length)];

}
// math = the 🧮 Math quiz type: only calculation questions (they carry a formula f). They are all new, so examOnly does not apply.
function pool(math){ return math ? QB.filter(q => q.f) : S.examOnly ? QB.filter(q => q.s !== "new") : QB; }
function topicStats(t){
  let c=0,w=0,s=0,seen=0; const qs = QB.filter(q=>q.t===t);
  for(const q of qs){ const h=S.hist[q.id]; if(h){ c+=h.c; w+=h.w; s+=h.s; seen++; } }
  return {c,w,s,seen,total:qs.length, answered:c+w+s, acc:(c+w)? c/(c+w) : null};
}
let lastIds = new Set();
function qWeight(q){
  const h = S.hist[q.id];
  let w = !h ? 4 : (h.last === "wrong" ? 5 : h.last === "skip" ? 3 : 1/(1+h.c));

function topicWeight(t){ const st = topicStats(t); const acc = st.acc===null ? .5 : st.acc; return (1 + 2*(1-acc)) / (1 + st.answered/4); }
function pickFromTopic(t, n, exclude, math){
  const cands = pool(math).filter(q => q.t===t && !exclude.has(q.id)); const out = [];
  while(out.length < n && cands.length){ const q = weightedPick(cands, qWeight); out.push(q); cands.splice(cands.indexOf(q),1); }
  return out;
}
function pickTopics(k, minQ, math){
  const p = pool(math); let topics = TOPICS.map((_,i)=>i).filter(t => p.filter(q=>q.t===t).length >= minQ); const chosen = [];

  const p = pool(math), used = new Set(), qs = [];

function buildExam(n){
  const p = pool(false), avail = TOPICS.map((_,t)=>p.filter(q=>q.t===t).length), counts = TOPICS.map(()=>0);

function beep(freqs, type="sine", dur=.12){

    for(const f of freqs){ const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.value=f; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur); t+=dur*.9; }

}

    const u = q.unit ? " "+txm(q.unit) : "";
    let h = `<div class="ex-row good">✅ <b>${T("correctAns")}:</b> ${numDisp(q,q.ans)}${u} <span class="hint">(${T("tolerance")} ±${numDisp(q,q.tol)})</span></div>`;
    if(res==="wrong") h += `<div class="ex-row bad">❌ <b>${T("yourAns")}:</b> ${numDisp(q,chosen)}${u}</div>`;
    else if(res==="skip") h += `<div class="ex-row">⏭️ ${T("skipped")}</div>`;
    else h += `<div class="ex-row good">✔ <b>${T("yourAns")}:</b> ${numDisp(q,chosen)}${u}</div>`;
    return h + `<div class="ex-why">💡 ${txm(q.w)}</div>`;
  }
  let h = multi
    ? `<div class="ex-row good">✅ <b>${T("correctSet")}:</b><ul>${q.a.map(i=>`<li>${optText(q,i)}</li>`).join("")}</ul></div>`
    : `<div class="ex-row good">✅ <b>${T("correctAns")}:</b> ${optText(q,q.a)}</div>`;
  h += `<div class="ex-why">💡 ${txm(q.w)}</div>`;
  if(res==="wrong"){
    if(!multi){ const n = xNote(q,chosen); h += `<div class="ex-row bad">❌ <b>${T("yourAns")}:</b> ${optText(q,chosen)}${n?`<div class="ex-note">↳ ${n}</div>`:""}</div>`; }
    else {
      const wrongT = chosen.filter(i=>!q.a.includes(i)), missed = q.a.filter(i=>!chosen.includes(i));
      if(wrongT.length) h += `<div class="ex-row bad">❌ <b>${T("wrongTicked")}:</b><ul>${wrongT.map(i=>`<li>${optText(q,i)}${xNote(q,i)?`<div class="ex-note">↳ ${xNote(q,i)}</div>`:""}</li>`).join("")}</ul></div>`;
      if(missed.length) h += `<div class="ex-row warn">⚠️ <b>${T("missed")}:</b><ul>${missed.map(i=>`<li>${optText(q,i)}${xNote(q,i)?`<div class="ex-note">↳ ${xNote(q,i)}</div>`:""}</li>`).join("")}</ul></div>`;
    }
  } else if(res==="skip") h += `<div class="ex-row">⏭️ ${T("skipped")}</div>`;
  if(q.kind !== "tf" || q.x){
    const open = res==="skip" || (multi && res!=="correct");
    h += (flat ? `<div class="allopts-flat"><b>${T("allOpts")}</b><ul>` : `<details class="allopts" ${open?"open":""}><summary>${T("allOpts")}</summary><ul>`) + q.o.map((_,i)=>{
      const c = multi ? q.a.includes(i) : i===q.a, picked = !isEmpty(chosen) && (multi ? chosen.includes(i) : chosen===i);
      const note = xNote(q,i) || (c ? T("seeAbove") : "");
      return `<li class="${c?"t":"f"}"><span class="mk">${c?"✓":"✗"}</span>${optText(q,i)}${picked?`<span class="you">${T("youPicked")}</span>`:""}${note?`<div class="note">${note}</div>`:""}</li>`;
    }).join("") + (flat ? `</ul></div>` : `</ul></details>`);
  }
  return h;
}
function recordHist(q, res){
  const h = S.hist[q.id] || (S.hist[q.id] = {c:0,w:0,s:0,last:null});
  if(res==="correct") h.c++; else if(res==="wrong") h.w++; else h.s++;
  h.last = res;
}

let M = null; // {topic, qs, orders, i (current), view, results[], streak, sel[]}
function startPractice(topic, math){
  math = !!math; const n = S.practiceLen;
  const qs = topic===undefined ? buildBalancedMission(n, math) : pickFromTopic(topic, n, new Set(), math);
  if(!qs.length){ flashMsg(T("noQ")); return; }
  M = {topic, math, qs, orders: qs.map(makeOrder), i:0, view:0, results:[], streak:0, sel:[], numDraft:""};
  show("play"); renderPractice(); practiceMood();
}
function flashMsg(msg){ const d=document.createElement("div"); d.className="panel"; d.style.marginBottom="10px"; d.textContent=msg; $("#planetGrid").before(d); setTimeout(()=>d.remove(),2500); }
const curScore = () => M ? M.results.reduce((s,r)=>s+r.pts,0) : 0;
const answeredCur = () => M.results.length > M.i;
const LOCO_SVG = `<svg viewBox="0 0 58 34" aria-hidden="true"><rect x="2" y="8" width="16" height="20" rx="2" fill="#1f2a36"/><rect x="0" y="5" width="20" height="3.5" rx="1.5" fill="#b3202b"/><rect x="5" y="11" width="9" height="6" rx="1" fill="#ffd678"/><rect x="17" y="13" width="32" height="15" rx="6" fill="#2b3846"/><rect x="17" y="23" width="34" height="2.5" fill="#b3202b"/><rect x="38" y="4" width="6" height="10" rx="1" fill="#1f2a36"/><circle cx="29" cy="13" r="3" fill="#c9a227"/><circle cx="50" cy="19" r="2.4" fill="#ffe9a8"/><path d="M48 26 L57 31 L46 31 Z" fill="#555c66"/><g fill="#23262d"><circle cx="9" cy="29" r="4"/><circle cx="24" cy="29" r="4"/><circle cx="35" cy="29" r="4"/><circle cx="45" cy="29.5" r="3.5"/></g></svg>`;
function renderTrack(){
  const n=M.qs.length; let h=`<div class="line"></div>`;

    h+=`<button class="dot ${cls} ${k===M.view?"viewing":""}" data-k="${k}" ${k<=M.i?"":"disabled"} title="${k+1}" style="left:calc(14px + (100% - 28px) * ${n>1?k/(n-1):0})"></button>`; }

  $("#track").querySelectorAll(".dot").forEach(d=>d.onclick=()=>{ const k=+d.dataset.k; if(k<=M.i){ M.view=k; renderPractice(); } });
  $("#liveScore").innerHTML = `${fmt(curScore())} <small>${T("score")} · ${T("q")} ${M.view+1}/${n}${M.streak>=2?" · 🔥"+M.streak:""}</small>`;
}
function renderPractice(){
  const k = M.view, q = M.qs[k], order = M.orders[k], r = M.results[k], isCurrent = k===M.i, answered = !!r;
  renderTrack();
  renderBody(q, $("#qmeta"), $("#qtext"), $("#qextra"), (M.math?`<span class="badge">${T("mathMission")}</span>`:"") + (M.topic===undefined?`<span class="badge">${T("balanced")}</span>`:`<span class="badge">${T("planetMission")}</span>`) + (!isCurrent?`<span class="badge review">${T("review")}</span>`:""));
  $("#opts").innerHTML = optsHTML(q, order, answered ? r.chosen : (q.kind==="multi" ? M.sel : q.kind==="num" ? M.numDraft : null), answered);
  if(!answered) $("#opts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickPractice(+b.dataset.o));
  const ninp = $("#opts .numin");

    ninp.oninput = () => { M.numDraft = ninp.value; $("#lockBtn").disabled = parseNum(ninp.value) === null; };
    ninp.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); lockPractice(); } else if(e.key==="Escape") ninp.blur(); };
    if(isCurrent) setTimeout(()=>ninp.focus({preventScroll:true}), 30);
  }

    fb.innerHTML = `<span class="pts ${r.res==="correct"?"good":r.res==="wrong"?"bad":""}">${fmtSigned(r.pts)}</span><div class="quip">${r.quip}</div>` + renderExplain(q, r.chosen); }
  else { fb.className = "feedback"; fb.innerHTML = ""; }
  // buttons
  $("#prevBtn").disabled = k===0;
  $("#skipBtn").style.display = (!answered && isCurrent) ? "" : "none";
  $("#lockBtn").style.display = (!answered && isCurrent && (q.kind==="multi" || q.kind==="num")) ? "" : "none";
  $("#lockBtn").disabled = q.kind==="num" ? parseNum(M.numDraft)===null : !M.sel.length;

  if(!isCurrent){ fwd.style.display=""; fwd.textContent = k+1===M.i ? T("backCur") : T("fwd"); } else fwd.style.display="none";
  const nb = $("#nextBtn");
  if(isCurrent && answered){ nb.style.display=""; nb.textContent = M.i===M.qs.length-1 ? T("finish") : T("next"); } else nb.style.display="none";
  $("#keysHint").textContent = T(q.kind==="multi" ? "keysMulti" : q.kind==="tf" ? "keysTf" : q.kind==="num" ? "keysNum" : "keysSingle");

function pickPractice(orig){
  const q = M.qs[M.i];
  if(M.view!==M.i || answeredCur()) return;
  if(q.kind==="multi"){ const s=M.sel; const j=s.indexOf(orig); if(j>=0) s.splice(j,1); else s.push(orig); renderPractice(); return; }
  commitPractice(orig);
}
function commitPractice(chosen){
  const q = M.qs[M.i];
  if(q.kind==="multi" && chosen!==null) chosen = [...chosen].sort((a,b)=>a-b);
  const res = resultOf(q, chosen), pts = pointsFor(q, chosen);
  const quip = pickQuip(res==="correct"?"good":res==="wrong"?"bad":"skip");
  M.results[M.i] = {q, res, pts, chosen: isEmpty(chosen) ? null : chosen, quip};
  recordHist(q, res); save();
  if(res==="correct"){ M.streak++; } else M.streak = 0;
  renderPractice();
  const card = $("#qcard"); void card.offsetWidth;
  const ref = $("#opts .opt.correct") || $("#opts .opt");
  const rect = ref ? ref.getBoundingClientRect() : {left:innerWidth/2,top:200,width:0,height:0};
  if(res==="correct"){ card.classList.add("glow"); burst(rect.left+rect.width/2, rect.top+rect.height/2, ["⭐","🎫","🚂","✨"]); beep([660,880,1320]); Sky.planet(q.t);
    if(M.streak>=3){ banner(T("streak")+M.streak); beep([523,659,784,1047],"triangle",.09); } }
  else if(res==="wrong"){ card.classList.add("shake"); beep([180,120],"sawtooth",.18); Sky.asteroid(); }
  else beep([440],"sine",.1);
  practiceMood();
  $("#nextBtn").focus({preventScroll:true});
}
function practiceNext(){
  if(!M) return;
  if(M.view < M.i){ M.view++; renderPractice(); return; }
  if(!answeredCur()) return;
  if(M.i < M.qs.length-1){ M.i++; M.view = M.i; M.sel = []; M.numDraft = ""; renderPractice(); }
  else finishPractice();
}
function lockPractice(){
  if(!M || M.view!==M.i || answeredCur()) return; const q = M.qs[M.i];
  if(q.kind==="num"){ const v = parseNum(M.numDraft); if(v!==null) commitPractice(v); }
  else if(q.kind==="multi" && M.sel.length) commitPractice(M.sel);
}
function practicePrev(){ if(M && M.view>0){ M.view--; renderPractice(); } }
function finishPractice(){
  const sc = curScore(), scaled = sc * (ROUND / M.qs.length);
  S.missions++; S.points += sc;
  if(M.qs.length===ROUND && M.topic===undefined && !M.math && (S.best===null || sc > S.best)) S.best = sc;
  lastIds = new Set(M.qs.map(q=>q.id)); save();
  lastReport = {mode:M.math ? "math" : "practice", d:new Date().toISOString(), qs:M.qs, ans:M.results.map(r=>r.chosen), groups:null};
  let rk=RANKS[0]; for(const r of RANKS) if(scaled>=r.min) rk=r;
  const cnt = k => M.results.filter(r=>r.res===k).length;
  $("#rank").innerHTML = `<span class="em">${rk.em}</span><div class="title">${rk[S.lang]}</div><div class="num">${fmt(sc)} / ${M.qs.length}</div><div class="sub">${T("resultSub").replace("{n}",M.qs.length)} · ${cnt("correct")}✓ ${cnt("wrong")}✗ ${cnt("skip")}⏭</div>`;
  $("#groupTable").innerHTML = "";
  $("#againBtn").textContent = T("again"); $("#againBtn").onclick = () => startPractice(M.topic, M.math);
  $("#review").innerHTML = (M.results.every(r=>r.res==="correct") ? `<div class="item good">${T("allGood")}</div>` : "") + M.results.map((r,i)=>reviewItem(r.q, r.chosen, r.pts, i)).join("");
  show("result");
  Sky.set("result", {hue:hueFor(Math.max(0,Math.min(1,scaled/7))), glow:.3+.5*Math.max(0,scaled/7), speed:.4, warp:0});
  if(scaled>=6.4){ Sky.nova(); setTimeout(()=>burst(innerWidth/2, 160, ["🎆","⭐","🚂","🎉"]),300); }
}
function reviewItem(q, chosen, pts, i){
  const res = resultOf(q, chosen), cls = res==="correct"?"good":res==="wrong"?"bad":"";
  const icon = res==="correct"?"✅":res==="wrong"?"❌":"⏭️";
  const head = `<div class="head"><span>${icon} ${i+1}. ${TOPICS[q.t].emoji} ${TOPICS[q.t][S.lang]}${q.kind!=="single"?" · "+kindName(q):""}</span><span>${fmtSigned(pts)}</span></div>`;
  const body = `<div class="qq">${txm(q.q)}</div>${q.c?`<pre class="code"><code>${q.c.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}</code></pre>`:""}${renderExplain(q, chosen)}`;
  return res==="correct" ? `<div class="item ${cls}">${head}<details><summary>${tx(q.q).replace(/<table[\s\S]*?<\/table>/g," … ").replace(/<[^>]+>/g,"").replace(/\$/g,"").replace(/\\[a-zA-Z]+/g,"").slice(0,90)}…</summary>${body}</details></div>` : `<div class="item ${cls}">${head}${body}</div>`;
}

/* ================= EXAM ================= */
let E = null; // {n, qs, groups, orders, ans[], flags[], view, deadline, armed}
let examTick = null;
function startExam(){
  const n = S.examLen, {qs, groups} = buildExam(n);
  if(!qs.length){ flashMsg(T("noQ")); return; }
  E = {n, qs, groups, orders: qs.map(makeOrder), ans: qs.map(()=>null), flags: qs.map(()=>false), view:0, deadline: S.timer ? Date.now() + qs.length*MIN_PER_Q*60000 : null, armed:false};
  persistExam(); openExam();
}
function persistExam(){ if(!E) return; S.examRun = {n:E.n, ids:E.qs.map(q=>q.id), groups:E.groups, orders:E.orders, ans:E.ans, flags:E.flags, view:E.view, deadline:E.deadline}; save(); }
function resumeExam(){
  const r = S.examRun; if(!r) return;
  const qs = r.ids.map(id=>QMAP.get(id)); if(qs.some(q=>!q)){ S.examRun=null; save(); renderHome(); return; }
  E = {n:r.n, qs, groups:r.groups, orders:r.orders, ans:r.ans, flags:r.flags, view:r.view||0, deadline:r.deadline, armed:false};
  openExam();
}
function openExam(){
  show("exam"); renderExam(); clearInterval(examTick);
  if(E.deadline){ $("#examTimer").style.display=""; examTick = setInterval(tickExam, 1000); tickExam(); } else $("#examTimer").style.display="none";
}
function tickExam(){
  if(!E || !E.deadline) return;
  const ms = E.deadline - Date.now();
  if(ms <= 0){ clearInterval(examTick); finishExam(true); return; }
  const s = Math.floor(ms/1000), hh = Math.floor(s/3600), mm = Math.floor(s%3600/60), ss = s%60;
  const el = $("#examTimer"); el.textContent = "⏱ " + (hh? hh+":" : "") + String(mm).padStart(2,"0") + ":" + String(ss).padStart(2,"0"); el.classList.toggle("low", ms < 5*60000);
}
function examMood(){ const done = E.ans.filter(a=>!isEmpty(a)).length / E.qs.length; Sky.set("exam", {hue:228 - done*20, glow:.22+.35*done, speed:.3+.4*done, warp:0}); }
function groupOf(i){ if(!E.groups) return -1; return E.groups.findIndex(g => i>=g.start && i<g.start+g.len); }
function renderExamNav(){

    : `<div class="navgroup"><div class="chips">${E.qs.map((_,i)=>chip(i)).join("")}</div></div>`;

function renderExam(){

  renderBody(q, $("#eqmeta"), $("#eqtext"), $("#eqextra"), `<span class="badge">${gi>=0?T("part")+" "+(gi+1)+" · ":""}${T("q")} ${k+1}/${E.qs.length}</span>`, true);

function pickExam(orig){
  const k = E.view, q = E.qs[k];
  if(q.kind==="multi"){ const s = Array.isArray(E.ans[k]) ? [...E.ans[k]] : []; const j=s.indexOf(orig); if(j>=0){ if(s.length===1){ E.hint = T("noClearMulti"); beep([200],"sine",.08); renderExam(); return; } s.splice(j,1); } else s.push(orig); E.ans[k] = s.sort((a,b)=>a-b); }
  else E.ans[k] = orig;

function examGo(d){ const v = E.view + d; if(v<0 || v>=E.qs.length) return; E.view = v; E.armed=false; persistExam(); renderExam(); }
function submitExam(){

}
function finishExam(timeUp){
  clearInterval(examTick);
  const sc = scoreExam(E.qs, E.ans, E.groups);
  E.qs.forEach((q,i)=>recordHist(q, resultOf(q, E.ans[i])));
  S.exams = [{d:new Date().toISOString(), n:E.qs.length, pts:sc.total, max:sc.max, pct:sc.pct, grade:sc.grade, ids:E.qs.map(q=>q.id), ans:E.ans, groups:E.groups, timeUp:!!timeUp}, ...(S.exams||[])].slice(0,10);

  $("#groupTable").innerHTML = groupTableHTML(sc);

  const idx = E.qs.map((_,i)=>i), rank = i => { const r = resultOf(E.qs[i], E.ans[i]); return r==="wrong"?0:r==="skip"?1:2; };

  if(sc.pct>=85){ Sky.nova(); setTimeout(()=>burst(innerWidth/2,160,["🎆","⭐","🎓","🎉"]),300); }
  E.done = true;
}

function groupTableHTML(sc){ return sc.groups ? `<table class="log"><tr><th>${T("part")}</th><th>${T("topic")}</th><th class="n">${T("raw")}</th></tr>${sc.groups.map((g,i)=>`<tr><td>${i+1}</td><td>${TOPICS[g.t].emoji} ${TOPICS[g.t].planet} · ${TOPICS[g.t][S.lang]}</td><td class="n"><b>${fmt(g.raw)} / ${g.len}</b></td></tr>`).join("")}<tr><td></td><td><b>${T("total")}</b></td><td class="n"><b>${fmt(sc.total)} / ${sc.max}</b></td></tr></table>` : ""; }
/* ================= PDF REPORT ================= */
let lastReport = null;
function buildReport(rep){
  const root = document.documentElement, prev = root.getAttribute("data-theme");
  root.setAttribute("data-theme", "light");
  try{
    const sc = scoreExam(rep.qs, rep.ans, rep.groups), en = S.lang === "en", exam = rep.mode === "exam";
    const date = new Date(rep.d).toLocaleString(en ? "en-GB" : "nb-NO", {dateStyle:"medium", timeStyle:"short"});
    let h = `<div class="rep"><h1>${T("repTitle")}</h1><div class="rsub">${exam ? T("repExam") : T("repPractice")} · ${date} · ${rep.qs.length} ${T("repQ")}</div>`;
    h += `<div class="rsum"><span>${T("score")}: <b>${fmt(sc.total)} / ${sc.max}</b></span><span><b>${fmt(sc.pct)} %</b></span>${exam ? `<span class="rgrade">${sc.grade}</span><span style="font-size:11px;color:#555;max-width:360px">${T("gradeNote")}</span>` : ""}</div>`;
    if(rep.timeUp) h += `<p>${T("timeUp")}</p>`;
    h += groupTableHTML(sc);
    h += `<h2>${T("debrief")}</h2>`;
    rep.qs.forEach((q,i) => { const ch = rep.ans[i], res = resultOf(q, ch), fh = figHTML(q.fig), gi = rep.groups ? rep.groups.findIndex(g => i>=g.start && i<g.start+g.len) : -1;
      h += `<div class="rq ${res==="correct"?"good":res==="wrong"?"bad":""}"><div class="rqh"><span>${res==="correct"?"✅":res==="wrong"?"❌":"⏭️"} ${i+1}. ${gi>=0 ? T("part")+" "+(gi+1)+" · " : ""}${TOPICS[q.t].emoji} ${TOPICS[q.t][S.lang]}${q.kind!=="single" ? " · "+kindName(q) : ""} · ${srcLabel(q)}</span><b>${fmtSigned(sc.perQ[i])}</b></div>`
        + `<div class="rqt">${txm(q.q)}</div>${formulaHTML(q)}${q.c ? `<pre class="code"><code>${esc(q.c)}</code></pre>` : ""}${fh ? `<div class="fig">${fh}</div>` : ""}${renderExplain(q, ch, true)}</div>`; });
    h += `<p style="color:#777;font-size:11px">${T("footer")}</p></div>`;
    $("#printReport").innerHTML = h;
  } finally { if(prev) root.setAttribute("data-theme", prev); else root.removeAttribute("data-theme"); }
}
function exportReport(rep){
  buildReport(rep);
  const old = document.title, d = new Date(rep.d), p = n => String(n).padStart(2,"0");
  document.title = `StokastiskEkspress-${rep.mode}-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
  const restore = () => { document.title = old; removeEventListener("afterprint", restore); };
  addEventListener("afterprint", restore); setTimeout(restore, 60000);
  window.print();
}

/* ================= STATISTICS HELPERS (tables + figures) ================= */
const ST = (() => {
  const LG = [676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  function lnGamma(x){ if(x < .5) return Math.log(Math.PI / Math.sin(Math.PI*x)) - lnGamma(1-x); x -= 1; let a = 0.99999999999980993; const t = x + 7.5; for(let i=0;i<8;i++) a += LG[i]/(x+i+1); return .5*Math.log(2*Math.PI) + (x+.5)*Math.log(t) - t + Math.log(a); }
  const lnChoose = (n,k) => lnGamma(n+1) - lnGamma(k+1) - lnGamma(n-k+1);
  const choose = (n,k) => (k<0||k>n) ? 0 : Math.round(Math.exp(lnChoose(n,k)));
  function binomPmf(x,n,p){ if(x<0||x>n) return 0; if(p===0) return x===0?1:0; if(p===1) return x===n?1:0; return Math.exp(lnChoose(n,x) + x*Math.log(p) + (n-x)*Math.log(1-p)); }
  function binomCdf(x,n,p){ let s=0; for(let k=0;k<=Math.min(x,n);k++) s += binomPmf(k,n,p); return Math.min(1,s); }
  function poisPmf(x,l){ if(x<0) return 0; return Math.exp(-l + x*Math.log(l) - lnGamma(x+1)); }
  function poisCdf(x,l){ let s=0; for(let k=0;k<=x;k++) s += poisPmf(k,l); return Math.min(1,s); }
  function hyperPmf(x,N,M,n){ return Math.exp(lnChoose(M,x) + lnChoose(N-M,n-x) - lnChoose(N,n)); }
  function erfc(x){ const z = Math.abs(x), t = 1/(1+.5*z);
    const r = t*Math.exp(-z*z-1.26551223+t*(1.00002368+t*(.37409196+t*(.09678418+t*(-.18628806+t*(.27886807+t*(-1.13520398+t*(1.48851587+t*(-.82215223+t*.17087277)))))))));
    return x >= 0 ? r : 2 - r; }
  const Phi = z => .5*erfc(-z/Math.SQRT2);
  const normPdf = (x,m=0,s=1) => Math.exp(-.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
  function zq(p){ // inverse standard normal cdf (Acklam), returns z with Phi(z)=p
    const a=[-39.69683028665376,220.9460984245205,-275.9285104469687,138.357751867269,-30.66479806614716,2.506628277459239], b=[-54.47609879822406,161.5858368580409,-155.6989798598866,66.80131188771972,-13.28068155288572], c=[-.007784894002430293,-.3223964580411365,-2.400758277161838,-2.549732539343734,4.374664141464968,2.938163982698783], d=[.007784695709041462,.3224671290700398,2.445134137142996,3.754408661907416];
    if(p<=0) return -Infinity; if(p>=1) return Infinity; const pl=.02425;
    if(p<pl){ const q=Math.sqrt(-2*Math.log(p)); return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    if(p>1-pl){ const q=Math.sqrt(-2*Math.log(1-p)); return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1); }
    const q=p-.5, r=q*q; return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1); }
  function betacf(a,b,x){ const MAXIT=300, EPS=3e-14, FPMIN=1e-300; let qab=a+b, qap=a+1, qam=a-1, c=1, d=1-qab*x/qap; if(Math.abs(d)<FPMIN) d=FPMIN; d=1/d; let h=d;
    for(let m=1;m<=MAXIT;m++){ const m2=2*m; let aa=m*(b-m)*x/((qam+m2)*(a+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN; d=1/d; h*=d*c;
      aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2)); d=1+aa*d; if(Math.abs(d)<FPMIN) d=FPMIN; c=1+aa/c; if(Math.abs(c)<FPMIN) c=FPMIN; d=1/d; const del=d*c; h*=del; if(Math.abs(del-1)<EPS) break; } return h; }
  function ibeta(x,a,b){ if(x<=0) return 0; if(x>=1) return 1; const bt=Math.exp(lnGamma(a+b)-lnGamma(a)-lnGamma(b)+a*Math.log(x)+b*Math.log(1-x));
    return x < (a+1)/(a+b+2) ? bt*betacf(a,b,x)/a : 1 - bt*betacf(b,a,1-x)/b; }
  function tCdf(t,v){ if(!isFinite(v)) return Phi(t); const x = v/(v+t*t), p = .5*ibeta(x, v/2, .5); return t >= 0 ? 1-p : p; }
  const tPdf = (t,v) => Math.exp(lnGamma((v+1)/2) - lnGamma(v/2) - .5*Math.log(v*Math.PI) - (v+1)/2*Math.log(1+t*t/v));
  function tq(p,v){ if(!isFinite(v)) return zq(p); let lo=-1e4, hi=1e4; for(let i=0;i<120;i++){ const m=(lo+hi)/2; if(tCdf(m,v)<p) lo=m; else hi=m; } return (lo+hi)/2; }
  const zCrit = a => zq(1-a), tCrit = (a,v) => tq(1-a,v);
  return {lnGamma, choose, binomPmf, binomCdf, poisPmf, poisCdf, hyperPmf, Phi, normPdf, zq, tCdf, tPdf, tq, zCrit, tCrit};
})();

/* ================= FORMULA SHEET & TABLES (modal) ================= */
let sheetTab = "f", sheetN = 10, sheetLamBlock = 1;
const f4 = v => v >= .99995 ? "1.0000" : v.toFixed(4);
function sheetTable(head, cols, rows, cell){ return `<div class="tabwrap"><table class="stab"><tr><th class="h">${head}</th>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${rows.map(r=>`<tr><td class="h">${r}</td>${cols.map((c,j)=>`<td>${cell(r,c,j)}</td>`).join("")}</tr>`).join("")}</table></div>`; }
function renderSheet(){
  const tabs = [["f","tFormulas"],["b","tBinom"],["p","tPois"],["n","tNorm"],["z","tZ"],["t","tT"]];
  $("#sheetTabs").innerHTML = tabs.map(([k,l]) => `<button class="pill ${sheetTab===k?"on":""}" data-st="${k}">${T(l)}</button>`).join("");
  $("#sheetTabs").querySelectorAll("[data-st]").forEach(b => b.onclick = () => { sheetTab = b.dataset.st; renderSheet(); });
  let h = "";
  if(sheetTab === "f"){
    const src = typeof FORMELARK !== "undefined" ? FORMELARK : [];
    h = `<div class="fsheet">` + src.map(sec => `<div class="fsec"><h3>${tx(sec.h)}</h3>${sec.rows.map(r => `<div class="frow"><span class="fn">${texify(tx(r[0]))}</span><span class="ff">${texify(tx(r[1]))}</span></div>`).join("")}</div>`).join("") + `</div>`;
  } else if(sheetTab === "b"){
    const ps = [.05,.1,.15,.2,.25,.3,.35,.4,.45,.5,.6,.7,.8,.9,.95], n = sheetN;
    h = `<div class="tabctl"><label>n = <input type="number" id="shN" min="1" max="40" value="${n}"></label><span class="hint">${T("binomHead")}</span></div>` +
      sheetTable("x \\ p", ps.map(p=>p.toFixed(2)), Array.from({length:n+1},(_,x)=>x), (x,_,j) => f4(ST.binomCdf(x,n,ps[j])));
  } else if(sheetTab === "p"){
    const blocks = [[.1,.2,.3,.4,.5,.6,.7,.8,.9,1],[1.5,2,2.5,3,3.5,4,4.5,5],[5.5,6,6.5,7,7.5,8,9,10],[11,12,13,14,15,16,18,20]], ls = blocks[sheetLamBlock] || blocks[1];
    let xmax = 0; while(ST.poisCdf(xmax, ls[ls.length-1]) < .99995 && xmax < 60) xmax++;
    h = `<div class="tabctl"><label>λ <select id="shL">${blocks.map((b,i)=>`<option value="${i}" ${i===sheetLamBlock?"selected":""}>${b[0]} – ${b[b.length-1]}</option>`).join("")}</select></label><span class="hint">${T("poisHead")}</span></div>` +
      sheetTable("x \\ λ", ls.map(String), Array.from({length:xmax+1},(_,x)=>x), (x,_,j) => f4(ST.poisCdf(x,ls[j])));
  } else if(sheetTab === "n"){
    const rows = []; for(let i=-34;i<=34;i++) rows.push(i);
    h = `<p class="hint">${T("normHead")}</p>` + sheetTable("z", Array.from({length:10},(_,k)=>"0.0"+k), rows, (i,_,k) => { const z = i<0 || (i===0 && false) ? i/10 - k/100 : i/10 + k/100; return f4(ST.Phi(z)); }).replace(/<td class="h">(-?\d+)<\/td>/g, (_,i) => `<td class="h">${(i<0?"−":"")+(Math.abs(i)/10).toFixed(1)}</td>`);
  } else if(sheetTab === "z"){
    const as = [.1,.05,.025,.01,.005,.001,.0005];
    h = `<p class="hint">${T("zHead")}</p>` + sheetTable("α", as.map(String), ["z<sub>α</sub>"], (_,__,j) => ST.zCrit(as[j]).toFixed(4));
  } else if(sheetTab === "t"){
    const as = [.1,.05,.025,.01,.005,.001,.0005], vs = [...Array.from({length:30},(_,i)=>i+1),40,50,60,80,100,120,Infinity];
    h = `<p class="hint">${T("tHead")}</p>` + sheetTable("ν \\ α", as.map(String), vs.map(v=>isFinite(v)?v:"∞"), (v,_,j) => ST.tCrit(as[j], v==="∞"?Infinity:+v).toFixed(3));

  $("#pdfBtn").onclick=()=>{ if(lastReport) exportReport(lastReport); };
  $("#nextBtn").onclick=practiceNext; $("#fwdBtn").onclick=()=>{ if(M.view+1===M.i){ M.view=M.i; renderPractice(); } else practiceNext(); };
  $("#prevBtn").onclick=practicePrev;
  $("#ePrevBtn").onclick=()=>examGo(-1); $("#eNextBtn").onclick=()=>examGo(1);
  $("#eFlagBtn").onclick=()=>{ E.flags[E.view]=!E.flags[E.view]; persistExam(); renderExam(); };
  $("#submitBtn").onclick=submitExam;
  $("#resetBtn").onclick=()=>{ if(!resetArmed){ resetArmed=true; $("#resetBtn").textContent=T("resetConfirm"); return; } const keep={lang:S.lang, sound:S.sound, theme:S.theme, mode:S.mode, examLen:S.examLen, practiceLen:S.practiceLen, timer:S.timer}; S=Object.assign(DEFAULT_STATE(), keep); save(); renderLog(); };
  document.addEventListener("keydown", e=>{
    if(e.ctrlKey||e.metaKey||e.altKey) return;
    if(sheetOpen()){ if(e.key==="Escape") closeSheet(); return; }
    const tag = (e.target.tagName||"").toLowerCase(); if(tag==="input") return;
    const key = e.key.toLowerCase(), act = activeScreen();
    const idxFromKey = (q) => { if(/^[1-8]$/.test(key)) return +key-1; if(q.kind==="tf"){ if(key==="t") return 0; if(key==="f") return 1; } if(q.kind!=="tf" && /^[a-h]$/.test(key)) return "abcdefgh".indexOf(key); return -1; };
    if(act==="play" && M){
      const q = M.qs[M.view];
      if(key==="arrowleft"){ e.preventDefault(); practicePrev(); return; }
      if(key==="arrowright"){ e.preventDefault(); if(M.view<M.i || answeredCur()) $("#fwdBtn").style.display!=="none" ? $("#fwdBtn").click() : practiceNext(); return; }
      if(M.view===M.i && !answeredCur() && q.kind==="num"){
        if(key==="s"){ e.preventDefault(); commitPractice(null); }
        else if(key==="enter"){ e.preventDefault(); lockPractice(); }
        else if(/^[0-9]$/.test(key) || key==="-" || key===","){ const inp=$("#opts .numin"); if(inp) inp.focus(); }
        return;
      }
      if(M.view===M.i && !answeredCur()){
        const k = idxFromKey(q);
        if(k>=0 && k<q.o.length){ e.preventDefault(); pickPractice(M.orders[M.i][k]); }
        else if(key==="s"){ e.preventDefault(); commitPractice(null); }
        else if(key==="enter" && q.kind==="multi" && M.sel.length){ e.preventDefault(); commitPractice(M.sel); }
      } else if(key==="enter" || key===" "){ if(document.activeElement && document.activeElement.tagName==="SUMMARY") return; e.preventDefault(); practiceNext(); }
    } else if(act==="exam" && E){
      const q = E.qs[E.view];
      if(key==="arrowleft"){ e.preventDefault(); examGo(-1); }
      else if(key==="arrowright"){ e.preventDefault(); examGo(1); }
      else if(q.o){ const k = idxFromKey(q); if(k>=0 && k<q.o.length){ e.preventDefault(); pickExam(E.orders[E.view][k]); } }
    }
  });
}
if(typeof document!=="undefined" && document.addEventListener) document.addEventListener("DOMContentLoaded", init);
</script>
